name: "Hello Actions"
description: "Greet someone"
author: "octocat@github.com"

inputs:
  MY_NAME:
    description: "Who to greet"
    required: true
    default: "World"

runs:
  using: "composite"
  steps:
    - run: echo "Hola mundo, ${{inputs.MY_NAME}}"
      shell: bash

branding:
  icon: "mic"
  color: "purple"